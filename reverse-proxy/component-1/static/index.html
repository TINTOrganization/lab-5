<body>
  <h1>Catalog — static assets</h1>
  <p>
    This page is served directly by nginx from <code>/static/</code>.
    The catalog backend (component-3) never receives this request, which
    demonstrates the acceleration property of the reverse proxy pattern.
  </p>

    <li><a href="/static/catalog.json">catalog.json</a></li>
  </ul>
