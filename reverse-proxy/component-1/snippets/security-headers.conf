# Security headers sent to the client.
# Included at server level and again in every location that has its own
# add_header (nginx does not inherit add_header in that case).
# `always` = also on error responses (404, 502...).

# Browsers must keep using HTTPS for this host.
add_header Strict-Transport-Security "max-age=31536000" always;
# Do not guess content types.
add_header X-Content-Type-Options "nosniff" always;
# The site cannot be embedded in a frame (clickjacking).
add_header X-Frame-Options "DENY" always;
# Do not leak URLs to other sites.
add_header Referrer-Policy "no-referrer" always;
# Only load resources from this same origin.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
