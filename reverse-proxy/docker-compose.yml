services:
  component-1:
    build: ./component-1
    container_name: component-1
    ports:
      - "8443:8443"
      - "8080:8080"
    depends_on:
      component-2:
        condition: service_healthy
      component-3:
        condition: service_healthy
    networks:
      - edge
      - internal

  component-2:
    build: ./component-2
    environment:
      SERVICE_NAME: orders
      PORT: 5000
    deploy:
      replicas: 3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  component-3:
    build: ./component-3
    environment:
      SERVICE_NAME: catalog
      PORT: 8000
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/catalog/')
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

networks:
  edge: {}
  internal:
    internal: true
