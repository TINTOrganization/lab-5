# -----------------------------------------------------------------------------
# 1) http {} context  — place these ABOVE the server {} block.
# -----------------------------------------------------------------------------

# --- Acceleration: response cache for /catalog/ ---
# keys_zone holds cache metadata in memory; cached bodies live under /var/cache.
# NOTE for A/D: the directory /var/cache/nginx/catalog must exist in the nginx
# container (the nginx:alpine image already ships /var/cache/nginx, and nginx
# creates the sub-path on start).
proxy_cache_path /var/cache/nginx/catalog
                 levels=1:2
                 keys_zone=catalog_cache:10m
                 max_size=100m
                 inactive=60s
                 use_temp_path=off;

# --- Acceleration: gzip compression ---
# NOTE: do NOT list text/html in gzip_types. nginx always compresses text/html
# by default, and repeating it makes `nginx -t` emit:
#   [warn] duplicate MIME type "text/html"
# which would show up in the checklist #8 evidence.
gzip              on;
gzip_vary         on;
gzip_min_length   256;
gzip_proxied      any;
gzip_types        application/json application/javascript text/css text/plain
                  application/xml;

# --- Load balancing + keep-alive to the catalog backend ---
# Single catalog instance, but using an upstream lets us hold keep-alive
# connections open to the backend (acceleration: avoids TCP/connection churn).
upstream catalog {
    server component-3:8000;
    keepalive 16;
}


# -----------------------------------------------------------------------------
# 2) server {} context — place these location blocks INSIDE the HTTPS server {}.
# -----------------------------------------------------------------------------

# --- /catalog/ : proxied to the catalog backend, with caching ---
location /catalog/ {
    proxy_pass http://catalog/;

    # Acceleration: cache responses and expose the cache state to the client.
    # proxy_cache_key uses $request_uri (NOT $uri) so the query string is part
    # of the key and different queries are cached separately.
    proxy_cache            catalog_cache;
    proxy_cache_valid      200 30s;
    proxy_cache_key        $scheme$request_method$host$request_uri;
    add_header             X-Cache-Status $upstream_cache_status always;

    # ------------------------------------------------------------------
    # COORDINATION WITH A (review point 6):
    # Any add_header inside a location CANCELS the add_header directives
    # inherited from the server {} block. So the security headers A defines
    # at server level would be LOST for /catalog/ unless we re-declare them
    # here. Re-add A's canonical security headers below (keep them in sync
    # with the server-level ones). Values shown are placeholders — A owns the
    # exact set/values. Using `always` so they are sent on error responses too.
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         DENY always;
    add_header Referrer-Policy         no-referrer always;
    # add_header Strict-Transport-Security "max-age=31536000" always;  # per A
    # ------------------------------------------------------------------

    # Keep-alive to the upstream requires HTTP/1.1 and a cleared Connection
    # header (so nginx does not forward "close").
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # Standard forwarding headers (A owns the canonical X-Forwarded-For policy;
    # shown here for completeness — A may override to match component-2).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- /static/ : files served directly by nginx (backend never hit) ---
# The static assets live in component-1/static/ (A's folder) and are copied
# into the nginx image / container at /usr/share/nginx/html/static/.
location /static/ {
    alias /usr/share/nginx/html/static/;
    autoindex off;
}


