# =============================================================================
# component-1 — reverse proxy (stock nginx). Owner: A.
#
# Single entry point of the system:
#   client --> nginx (8443 HTTPS / 8080 redirect) --> orders x3   (component-2)
#                                                 \-> catalog x1  (component-3)
#
# Integrates the fragments handed off by B (component-2/nginx-fragment.conf)
# and C (component-3/nginx-fragment.conf). Shared policies live in snippets/:
#   snippets/security-headers.conf   response headers sent to the client
#   snippets/proxy-headers.conf      request headers sent to the backends
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log used as evidence in the guide:
    #   upstream = backend that answered ("-" when nginx answered by itself:
    #              static file, cache HIT, 404, 301)
    #   cache    = MISS / HIT / EXPIRED for /catalog/
    #   xff_in   = X-Forwarded-For value the CLIENT sent (never forwarded)
    log_format  proxy  '$remote_addr "$request" $status $body_bytes_sent '
                       'upstream=$upstream_addr cache=$upstream_cache_status '
                       'xff_in="$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  proxy;

    sendfile           on;
    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # Security (A): hide what is running behind the proxy.
    # -------------------------------------------------------------------------
    # No nginx version in the Server header or in error pages.
    server_tokens off;
    # nginx already drops the backend's own Server header (Werkzeug / uvicorn);
    # also drop the usual framework banner in case a backend ever adds it.
    proxy_hide_header X-Powered-By;

    # -------------------------------------------------------------------------
    # Acceleration (C): response cache for /catalog/ and gzip compression.
    # -------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/catalog
                     levels=1:2
                     keys_zone=catalog_cache:10m
                     max_size=100m
                     inactive=60s
                     use_temp_path=off;

    # text/html is always compressed; listing it again makes `nginx -t` warn.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/css text/plain
                      application/xml;

    # -------------------------------------------------------------------------
    # Load balancing (B): the 3 orders replicas, round-robin + passive failover.
    # `component-2` resolves to 3 IPs (one per replica) when nginx starts.
    # -------------------------------------------------------------------------
    upstream orders {
        server component-2:5000 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    # Single catalog instance; the upstream block is what allows keep-alive
    # connections to the backend (C).
    upstream catalog {
        server component-3:8000;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # HTTP (8080): nothing is served in clear text, everything goes to HTTPS.
    # -------------------------------------------------------------------------
    server {
        listen 8080 default_server;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }

    # -------------------------------------------------------------------------
    # HTTPS (8443): TLS terminates here; backends only ever see plain HTTP
    # coming from nginx over the internal network.
    # -------------------------------------------------------------------------
    server {
        listen 8443 ssl default_server;
        server_name _;

        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # Security headers for every response of this server (also on errors).
        # A location that declares its own add_header must include this file
        # again, because add_header is not inherited in that case.
        include /etc/nginx/snippets/security-headers.conf;

        # --- /orders/ : balanced across the 3 replicas, with failover (B) ---
        location /orders/ {
            proxy_pass http://orders/;

            # If a replica refuses the connection, times out or answers
            # 502/503/504, retry on the next one: the client sees no error.
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout     2s;

            include /etc/nginx/snippets/proxy-headers.conf;
        }

        # --- /catalog/ : proxied to catalog, cached (C) ---
        location /catalog/ {
            proxy_pass http://catalog/;

            proxy_cache        catalog_cache;
            proxy_cache_valid  200 30s;
            proxy_cache_key    $scheme$request_method$host$request_uri;
            add_header         X-Cache-Status $upstream_cache_status always;

            # add_header above cancels the server-level headers: declare again.
            include /etc/nginx/snippets/security-headers.conf;

            include /etc/nginx/snippets/proxy-headers.conf;
        }

        # --- /static/ : files served by nginx itself, no backend involved (C) ---
        location /static/ {
            alias /usr/share/nginx/html/static/;
            autoindex off;
        }

        # --- Internal endpoints are not reachable through the proxy (A) ---
        # /orders/ and /catalog/ strip their prefix, so without this rule
        # /orders/health would reach Flask's /health, and /catalog/docs,
        # /catalog/redoc and /catalog/openapi.json would reach the pages
        # FastAPI generates by default. Regex locations win over the prefix
        # locations above.
        location ~ ^/(orders|catalog)/(health|docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        location = /health {
            return 404;
        }

        # --- Anything that is not a published route does not exist (A) ---
        location / {
            return 404;
        }
    }
}
