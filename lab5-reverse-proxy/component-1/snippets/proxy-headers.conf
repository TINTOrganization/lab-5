# Request headers sent to the backends. Owner: A.
# Included in every proxied location (/orders/, /catalog/).

# Keep-alive connections to the backends need HTTP/1.1 and an empty
# Connection header (otherwise nginx sends "Connection: close").
proxy_http_version 1.1;
proxy_set_header   Connection "";

# Forwarding headers are always SET by the proxy from what it sees on the
# connection, never copied or appended from the client request. A client that
# sends "X-Forwarded-For: 1.2.3.4" cannot make the backend believe it.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Same for the standard "Forwarded" header (RFC 7239): an empty value means
# the header is not passed to the backend at all.
proxy_set_header Forwarded         "";
