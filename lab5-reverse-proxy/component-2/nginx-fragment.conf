# HANDOFF NOTE TO D (compose owner):
#   docker-compose.yml — orders service, 3 replicas, internal only:
#
#     component-2:
#       build: ./component-2
#       environment:
#         SERVICE_NAME: orders
#         PORT: 5000
#       deploy:
#         replicas: 3
#       networks:
#         - internal
#
#   - NO `ports:` (only nginx publishes ports).
#   - NO `container_name:` (compose cannot scale a service with a fixed name).
#   - docker-compose.insecure.yml: do not map the same fixed host port for all
#     3 replicas (e.g. "5000:5000" fails on the 2nd replica). Use an ephemeral
#     host port ("5000") or a range ("5001-5003:5000").
# =============================================================================
