# -----------------------------------------------------------------------------
# 1) http {} context — place this ABOVE the server {} block.
# -----------------------------------------------------------------------------

# --- Load balancing across the 3 orders replicas ---
# `component-2` is the compose service name. With 3 replicas, Docker's embedded
# DNS returns 3 IPs for that name; nginx resolves it ONCE at startup and adds
# each IP as a separate upstream server. Default method: round-robin.
#
# Passive health checks (failover):
#   max_fails=1 fail_timeout=10s -> after 1 failed attempt, that replica is
#   taken out of rotation for 10s, then retried.
upstream orders {
    # Shared memory zone: all nginx workers use ONE round-robin counter and
    # ONE failure count. Without it each worker rotates on its own and the
    # 20-request test comes out uneven (e.g. 15/7/8 instead of 10/10/10).
    zone orders 64k;

    server component-2:5000 max_fails=1 fail_timeout=10s;

    # Keep-alive connections to the backends (pairs with proxy_http_version 1.1
    # and the cleared Connection header in the location below).
    keepalive 16;
}


# -----------------------------------------------------------------------------
# 2) server {} context — place this location block INSIDE the HTTPS server {}.
# -----------------------------------------------------------------------------

# --- /orders/ : balanced across the 3 replicas, with failover ---
location /orders/ {
    proxy_pass http://orders/;

    # Failover: if a replica refuses the connection, times out or answers
    # 502/503/504, retry the same request on the next replica, so the client
    # does not see the error. Only idempotent requests (e.g. GET) are retried.
    proxy_next_upstream       error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # Short connect timeout: a stopped replica is detected quickly and the
    # request moves on to the next one instead of hanging (default is 60s).
    proxy_connect_timeout 2s;

    # Keep-alive to the upstream requires HTTP/1.1 and a cleared Connection
    # header (so nginx does not forward "close").
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # Standard forwarding headers (same as component-3; A owns the canonical
    # X-Forwarded-For policy: $remote_addr overwrites any spoofed value).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}


